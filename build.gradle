plugins {
    //id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
}

subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    java.withSourcesJar()
    java.withJavadocJar()

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_id}" }
        }
        manifest {
            attributes(['Specification-Title'     : mod_display_name,
                        'Specification-Vendor'    : author,
                        'Specification-Version'   : project.jar.archiveVersion,
                        'Implementation-Title'    : project.name,
                        'Implementation-Version'  : project.jar.archiveVersion,
                        'Implementation-Vendor'   : author,
                        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                        'Timestamp'               : System.currentTimeMillis(),
                        'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                        'Built-On-Minecraft'      : minecraft_version])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_display_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }
        maven {
            // location of the maven that hosts JEI files before January 2023
            name = "Progwml6's maven"
            url = "https://dvs1.progwml6.com/files/maven/"
        }
        maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            url = "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(17)
    }

    processResources {
        def expandProps = [
                //Project
                "projectGroup"              : project.group, //Else we target the task's group
                //Mod
                "mod_id"                    : "${mod_id}",
                "mod_version"               : "${mod_version}",
                "mod_display_name"          : "${mod_display_name}",
                //Minecraft
                "minecraft_version"         : "${minecraft_version}",
                "minecraft_version_range"   : "${minecraft_version_range}",
                //Common
                "author"                    : "${author}",
                "license"                   : "${license}",
                "credits"                   : "${credits}",
                "description"               : "${mod_description}",
                "displayURL"                : "${displayURL}",
                "issueTrackerURL"           : "${issueTrackerURL}",
                "updateJSONURL"             : "${updateJSONURL}",
                //Forge
                "forge_version"             : "${forge_version}",
                "forge_loader_version_range": "${forge_loader_version_range}",
                //Fabric
                "fabric_version"            : "${fabric_version}",
                "fabric_loader_version"     : "${fabric_loader_version}",
                //Dependencies
                "fcap_version"              : "${fcap_version}",
                "fcap_version_range"        : "${fcap_version_range}"]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}